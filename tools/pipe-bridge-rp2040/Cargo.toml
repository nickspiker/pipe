# Standalone embedded crate — excluded from the parent pipe workspace because it targets thumbv6m-none-eabi.
[workspace]

[package]
name = "pipe-bridge-rp2040"
version = "0.1.0"
edition = "2021"
description = "RP2040-Zero firmware: dumb USB-CDC ↔ PIPE wire bridge"
publish = false

[dependencies]
embassy-executor = { version = "0.6", features = ["arch-cortex-m", "executor-thread", "integrated-timers"] }
embassy-time     = { version = "0.3", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp       = { version = "0.2", features = ["defmt", "time-driver", "critical-section-impl", "rp2040"] }
embassy-usb      = { version = "0.3", features = ["defmt"] }
embassy-sync     = { version = "0.6", features = ["defmt"] }
embassy-futures  = { version = "0.1" }

defmt        = "0.3"
defmt-rtt    = "0.4"
panic-probe  = { version = "0.3", features = ["print-defmt"] }

cortex-m     = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt  = "0.7"
critical-section = "1.1"
portable-atomic  = { version = "1.5", features = ["critical-section"] }
static_cell      = "2"

[profile.release]
debug         = true       # keep symbols for defmt RTT logs
opt-level     = "s"
lto           = "fat"
codegen-units = 1
overflow-checks = false
