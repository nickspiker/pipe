# Standalone embedded crate — excluded from the parent pipe workspace because it targets thumbv6m-none-eabi.
[workspace]

[package]
name = "pipe-bridge-rp2040"
version = "0.1.0"
edition = "2021"
description = "RP2040-Zero firmware: dumb USB-CDC ↔ PIPE wire bridge"
publish = false

[features]
# Build the firmware to load and execute from SRAM via `picotool load --execute`. The dev iteration loop becomes: send `bootsel` via host CLI → bridge enters the silicon PICOBOOT interface → picotool loads a fresh ram-image build → picotool jumps to it. No flash writes after the initial bootstrap, no flash wear, no manual BOOTSEL button presses between iterations.
#
# Layout differs from the default (flash) build only in memory.x — picked by build.rs based on this feature.
ram-image = []

[dependencies]
embassy-executor = { version = "0.6", features = ["arch-cortex-m", "executor-thread", "integrated-timers"] }
embassy-time     = { version = "0.3" }
embassy-rp       = { version = "0.2", features = ["time-driver", "critical-section-impl", "rt", "boot2-w25q080", "unstable-pac"] }
embassy-usb      = { version = "0.3" }
embassy-sync     = { version = "0.6" }
embassy-futures  = { version = "0.1" }

panic-halt   = "0.2"

cortex-m     = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt  = "0.7"
critical-section = "1.1"
portable-atomic  = { version = "1.5", features = ["critical-section"] }
static_cell      = "2"

blake3 = { version = "1.5", default-features = false }

# Unified VSF crate (no_std + alloc mode). Bridge cmd/resp packets are complete
# VSF documents now — encode via vsf::vsf_builder::VsfBuilder, decode via
# vsf::file_format::VsfHeader::decode + vsf::verification::is_original.
vsf = { path = "../../../vsf", default-features = false }

# Linked-list-first-fit heap. 32 KB static .bss buffer is plenty for bridge
# packets (each <1 KB; we never queue more than one in-flight at a time).
embedded-alloc = "0.5"

[profile.release]
debug         = false
opt-level     = "z"
lto           = "fat"
codegen-units = 1
overflow-checks = false
strip         = true
