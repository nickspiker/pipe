[package]
name = "pipe-host"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "PIPE host-side: mirror-XOR codec, FT232H bit-bang, ragu verifier."

[lib]
name = "pipe_host"
path = "src/lib.rs"

[dependencies]
pipe-enclave = { path = "../enclave" }
blake3 = "1.5"
ftdi-nusb = "0.1"
vsf = { path = "../../vsf", features = ["inspect"] }
serialport = "4"
nunc-time = "0.0.0"
